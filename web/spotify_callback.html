<!DOCTYPE html>
<meta charset="utf-8">
<title>Spotify connected</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0B0C;color:#F5F5F5;font:16px system-ui,sans-serif;text-align:center;padding:16px}</style>
<p>Spotify is connected. You can close this window if it doesn’t close by itself.</p>
<script>
  (function () {
    var message = { 'flutter-web-auth-2': window.location.href };
    if (window.opener) {
      window.opener.postMessage(message, window.location.origin);
      window.close();
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage(message, window.location.origin);
    } else {
      localStorage.setItem('flutter-web-auth-2', window.location.href);
      window.close();
    }
  })();
</script>
