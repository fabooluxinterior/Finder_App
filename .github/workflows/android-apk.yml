name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'supabase/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # Demo APK: no secrets needed, runs fully offline with sample data.
      - name: Build demo APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/finder-demo-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/finder-demo-armv7.apk

      # Live APK: built only when the repository has Supabase secrets configured.
      - name: Build live APK
        if: ${{ env.SUPABASE_URL != '' }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk out/finder-live-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: finder-apk
          path: out/*.apk
          retention-days: 14
