name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Rust crypto core tests
        working-directory: rust
        run: cargo test --locked

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Edge function tests
        working-directory: supabase/functions
        run: |
          deno test --allow-read --allow-env _shared/tests/
          for f in process-image media delete-account media-maintenance revenuecat-webhook photo-remove music-connect music-callback music-sync; do deno check $f/index.ts; done

      - name: Database RLS / attack-scenario tests
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/run.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Flutter analyze + tests (E2EE engine against the native library)
        run: |
          (cd rust && cargo build --locked)
          flutter pub get
          flutter analyze
          flutter test

  build:
    needs: security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-android-${{ hashFiles('rust/Cargo.lock') }}

      - run: flutter pub get

      # Demo APK (`demo` flavor): offline sample data, no secrets needed.
      # The `prod` flavor never contains demo code or assets/demo/.
      # SPOTIFY_CLIENT_ID (a repository *variable*; a public ID, not a secret)
      # turns on real Spotify sign-in (PKCE) in the demo. Unset: sample artists.
      - name: Build demo APK
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          flutter build apk --release --flavor demo --dart-define=DEMO=true \
            --dart-define=SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
            --split-per-abi --target-platform android-arm64,android-arm
          mkdir -p out
          ls build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*arm64*demo*release.apk out/finder-demo-arm64.apk
          cp build/app/outputs/flutter-apk/*armeabi*demo*release.apk out/finder-demo-armv7.apk

      # Live APK: built only when the repository has Supabase secrets configured.
      - name: Build live APK
        if: ${{ env.SUPABASE_URL != '' }}
        run: |
          flutter build apk --release --flavor prod --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY"
          cp build/app/outputs/flutter-apk/*prod*release.apk out/finder-live-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: finder-apk
          path: out/*.apk
          retention-days: 14
